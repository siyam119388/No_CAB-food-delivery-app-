<!DOCTYPE html>
<!-- ==========================================================

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoCap — Hello</title>
  <link rel="icon" href="assets/logo-mark.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <img src="assets/logo-mark.svg" alt="">
    <b>No<i>Cap</i></b>
  </a>
  <nav class="topnav">
    <a class="on" href="home.html"><span>&#127968;</span>Home</a>
    <a class="" href="checkout.html"><span>&#128722;</span>Cart</a>
    <a class="" href="orders.html"><span>&#128203;</span>Orders</a>
    <a class="" href="profile.html"><span>&#128100;</span>Profile</a>
  </nav>
  <div class="topbar-right">
    <span class="mocktag" id="mockTag"></span>
    <span class="role">CUSTOMER</span>
  </div>
</header>

<main class="page">
  <div class="wrap">
    <div class="page-head">
      <h1 id="pageTitle">Hello</h1>
      <p id="pageSub">&#128205; Dhaka</p>
    </div>

    <input class="input" id="search" placeholder="&#128269;  Search restaurants...">
    <div style="margin-bottom:11px">
      <span class="chip on" data-cuisine="All">All</span>
      <span class="chip" data-cuisine="Italian">&#127829; Italian</span>
      <span class="chip" data-cuisine="Indian">&#127837; Indian</span>
    </div>

    <div class="card card-blue"><div class="small">
      <span class="blue">&#9989; Only verified restaurants appear here.</span>
      Anything still pending admin approval is hidden.
    </div></div>

    <div class="title">RESTAURANTS NEAR YOU</div>
    <div id="restaurantList"></div>
  </div>
</main>

<nav class="tabbar">
    <a class="on" href="home.html"><span>&#127968;</span>Home</a>
    <a class="" href="checkout.html"><span>&#128722;</span>Cart</a>
    <a class="" href="orders.html"><span>&#128203;</span>Orders</a>
    <a class="" href="profile.html"><span>&#128100;</span>Profile</a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/customer.js"></script>
  <script>
    document.getElementById("mockTag").textContent = USE_MOCK ? "demo data" : "live api";
    const u = requireRole("CUSTOMER");
    if (u) {
      document.querySelector("#pageTitle").textContent = "Hello, " + firstName(u.name);
      document.querySelector("#pageSub").innerHTML = "&#128205; " + (u.address || "Dhaka");
      loadHome();
    }
  </script>
</body>
</html>
