<!DOCTYPE html>
<!-- ==========================================================

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoCap — Manage Menu</title>
  <link rel="icon" href="../assets/logo-mark.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="../index.html">
    <img src="../assets/logo-mark.svg" alt="">
    <b>No<i>Cap</i></b>
  </a>
  <nav class="topnav">
    <a class="" href="dashboard.html"><span>&#128202;</span>Dashboard</a>
    <a class="on" href="menu.html"><span>&#128221;</span>Menu</a>
    <a class="" href="orders.html"><span>&#128230;</span>Orders</a>
    <a class="" href="hygiene.html"><span>&#128247;</span>Hygiene</a>
  </nav>
  <div class="topbar-right">
    <span class="mocktag" id="mockTag"></span>
    <span class="role">RESTAURANT</span>
  </div>
</header>

<main class="page">
  <div class="wrap">
    <div class="page-head">
      <h1 id="pageTitle">Manage Menu</h1>
      <p id="pageSub">Add items, mark out of stock</p>
    </div>

    <div class="tabs" id="catTabs"></div>
    <div id="menuList"></div>

    <button class="btn" id="addBtn">+ Add New Item</button>

    <div class="hide" id="addForm">
      <div class="title">NEW ITEM</div>
      <input class="input" id="itemName" placeholder="Item name">
      <input class="input" id="itemPrice" type="number" placeholder="Price in Taka">
      <input class="input" id="itemCat" placeholder="Category (e.g. Pizzas)">
      <input class="input" id="itemDesc" placeholder="Short description">
      <div class="err" id="itemErr"></div>
      <button class="btn" id="saveItem">Save Item</button>
    </div>
  </div>
</main>

<nav class="tabbar">
    <a class="" href="dashboard.html"><span>&#128202;</span>Dashboard</a>
    <a class="on" href="menu.html"><span>&#128221;</span>Menu</a>
    <a class="" href="orders.html"><span>&#128230;</span>Orders</a>
    <a class="" href="hygiene.html"><span>&#128247;</span>Hygiene</a>
  </nav>

  <script src="../js/api.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/restaurant.js"></script>
  <script>
    document.getElementById("mockTag").textContent = USE_MOCK ? "demo data" : "live api";
    if (requireRole("RESTAURANT_OWNER", "../index.html")) loadOwnerMenu();
  </script>
</body>
</html>
